<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#10B75A" />

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/eatsure-app-icon.png" type="image/png" />
  <link rel="apple-touch-icon" href="assets/eatsure-app-icon.png" />
  <link rel="stylesheet" href="styles.css" />

  <title>EatSure</title>
</head>

<body>

<main class="wrap">

  <section class="hero">
    <h1 class="brand-heading">
      <img src="assets/eatsure-brand.png" alt="EatSure" class="brand-logo" />
    </h1>
  </section>

  <section class="card" id="startSection">
    <h2>Baslayalim</h2>
    <p class="muted small">Bir yol sec. Gerekirse sonraki adimi EatSure acacak.</p>

    <div class="action-list">
      <button id="startCameraBtn" class="btn btn-primary">Barkodu Tara</button>
      <button id="manualBarcodeBtn" class="btn btn-secondary">Barkodu Kendim Girecegim</button>
      <button id="noBarcodeBtn" class="btn btn-secondary">Barkod Yok</button>
    </div>

    <div id="manualBarcodePanel" class="manual-panel hidden">
      <label class="label" for="barcodeInput">Barkod</label>
      <input
        id="barcodeInput"
        class="input"
        type="text"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Orn: 8006980240651"
      />
      <button id="scanProductBtn" class="btn btn-primary">Devam Et</button>
    </div>

    <div id="reader" class="reader-box"></div>
    <button id="stopCameraBtn" class="btn btn-secondary hidden">Kamerayi Kapat</button>
  </section>

  <section class="card hidden" id="photoSection">
    <h2 id="photoStepTitle">Etiket fotografi</h2>
    <p id="photoStepText" class="muted small"></p>

    <input
      id="frontFileInput"
      type="file"
      accept="image/*"
      capture="environment"
      class="file hidden"
    />

    <input
      id="ingredientsFileInput"
      type="file"
      accept="image/*"
      capture="environment"
      class="file hidden"
    />

    <input
      id="extraFileInput"
      type="file"
      accept="image/*"
      capture="environment"
      class="file hidden"
    />

    <button id="choosePhotoBtn" class="btn btn-primary">Fotograf Cek veya Sec</button>

    <div id="extraChoicePanel" class="action-list hidden">
      <button id="addExtraPhotoBtn" class="btn btn-secondary">Evet, ek fotograf var</button>
      <button id="skipExtraPhotoBtn" class="btn btn-primary">Hayir, sonucu goster</button>
    </div>

    <div id="photoProgress" class="photo-progress"></div>
  </section>

  <section class="card">
    <h2>Sonuc</h2>
    <div id="userResult" class="user-result empty-state">
      Henuz sonuc yok.
    </div>
  </section>

  <section class="debug-shell">
    <button id="toggleDebugBtn" class="btn btn-secondary btn-small">Debug</button>

    <section id="debugPanel" class="hidden">
      <section class="card">
        <h2>OCR / AI Extraction</h2>
        <textarea
          id="ocrText"
          class="textarea"
          rows="10"
          placeholder="OCR veya AI extraction sonucu..."
        ></textarea>
        <button id="analyzeTextBtn" class="btn btn-primary">Bu Metni Analiz Et</button>
      </section>

      <section class="card">
        <h2>Backend Sonucu</h2>
        <pre id="backendResult" class="pre">Henuz sonuc yok.</pre>
      </section>
    </section>
  </section>

</main>

<script
src="https://unpkg.com/@zxing/browser@0.2.0/umd/zxing-browser.min.js"
onerror="this.onerror=null;this.src='https://cdn.jsdelivr.net/npm/@zxing/browser@0.2.0/umd/zxing-browser.min.js'">
</script>

<script src="app.js"></script>

</body>
</html>
